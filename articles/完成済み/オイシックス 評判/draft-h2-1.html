<h2>オイシックスの評判は食材の質が好評で料金に不満が多い</h2>
オイシックスの評判では、食材の質や時短を評価する声が目立ちます。

一方で、料金や量に不満を感じる人もいます。

<table style="width: 100%;">
<tbody>
<tr><th style="width: 50%;">好評のポイント</th><th style="width: 50%;">不満のポイント</th></tr>
<tr><td>帰宅後すぐ調理できる時短性</td><td>自炊やスーパーより割高</td></tr>
<tr><td>届く野菜や果物の鮮度</td><td>量が少なく感じる商品がある</td></tr>
<tr><td>献立決めと買い物の手間が減る</td><td>不要な商品が自動カートで届くことがある</td></tr>
<tr><td>普段作らない料理でレパートリーが増える</td><td>お試し後に勧誘の連絡が来ることがある</td></tr>
</tbody>
</table>
