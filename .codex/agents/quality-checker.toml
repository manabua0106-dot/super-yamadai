ションで同じ内容を繰り返していないか\n- [ ] FAQが本文の既出内容の焼き直しになっていないか\n\n### 7. 訴求バランス（§I-2）\n\n- [ ] 訴求サービスの紹介文が150〜250字の範囲か\n- [ ] 非訴求サービスの紹介文が100〜180字の範囲か\n- [ ] 解説セクションのサービス名言及は1セクションにつき最大2社までか\n- [ ] 注意点セクションで特定サービスを名指し推薦していないか\n- [ ] 選び方セクションでも特定サービス名指しは避けているか\n\n### 8. 法令セーフ変換チェック（writing-manual 付録1）\n\n- [ ] 「管理栄養士が監修」→「献立設計に関与」に変換済みか\n- [ ] 「専門医の指導のもと」→ 削除 or「監修者情報は公式サイト参照」に変換済みか\n- [ ] 「栄養バランスの整った食事がとれる」→「栄養成分表示を確認しながら食事を選べる」に変換済みか\n- [ ] 全ての「〇〇%OFF」「送料無料」に条件が同一文内で併記されているか\n- [ ] 「初回半額」→「初回限定の割引キャンペーンあり（条件は公式サイトで要確認）」に変換済みか\n- [ ] 「制限食」「食事制限向け」→「栄養成分に配慮したコース」に変換済みか\n- [ ] 疾病名が導入文のSEO用1回を超えて本文に残っていないか\n- [ ] 「国産食材100%」「無添加」→「主要食材に国産品を使用」等に変換済みか\n- [ ] メニュー数の固定値に「記事確認時点で」「時期により変動」が付いているか\n- [ ] 「ダイエット向け」「筋力アップ向け」→「たんぱく質量やカロリー量の異なるメニュー」に変換済みか\n- [ ] 「全額返金保証」→「返金保証あり・適用条件は公式サイトで要確認」に変換済みか\n\n### 9. 法令チェック（§G-1・§G-5）\n\n- [ ] 「No.1」「最安」等に根拠があるか\n- [ ] 割引表現の比較対象が明示されているか\n- [ ] 「送料無料」と書いている全箇所で条件が併記されているか\n- [ ] 特定栄養素の不足・効果を断言していないか\n- [ ] 「レストラン品質」「手作り」「本格的」「一流」等の品質断言が根拠ある表現になっているか\n- [ ] 「〇〇%OFF」の比較対象（通常価格）が明示されているか\n\n### 10. 免責文・注記チェック\n\n- [ ] 導入文のstrong締め直後に掲載順・価格時点・キャンペーン条件の注記があるか\n- [ ] まとめ末尾に価格時点・編集部基準の免責文があるか\n- [ ] 疾病名を含む記事の場合、医療助言ではない旨の免責文があるか\n- [ ] 比較表（複数社横並びtable）の直下に注記テンプレートがあるか\n\n### 11. 出典URL併記チェック（v4.0 新規・§F-4）\n\n- [ ] 具体的な数値・統計に `[出典名](URL)` 形式でリンクが併記されているか\n\n### 12. 箇条書きチェック（v4.0 更新・§D-3）\n\n- [ ] 選び方・メリット・注意点のH3に ulリストまたはテーブルが最低1つ入っているか（8割目安）\n- [ ] ul/li内の項目末に句点（。）がないか\n\n---\n\n## 修正案の出し方\n\n```\n【品質チェック】チェック{N}\n- 箇所: {H3 id} の {行}\n- 問題: {何が違反しているか}\n- 修正案: {具体的な修正文}\n```\n\n---\n\n## 変更履歴\n\n### v4.0（2026-04-24）\n\n- 参照型化：独自ルール削除、writing-manual.md 参照へ\n- H2直下imgタグ必須チェックを削除（画像ルール緩和）\n- 箇条書きルール更新（使用OK）\n- strong締めの最終段落限定チェックを削除\n- 出典URL併記チェック（§F-4）を追加\n- FAQ語尾統一チェック（§A-6）を追加\n- v4.0 の法令セーフ変換表10パターンに更新\n\n### v3.0\n\n- 初版\n"
